<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada | Victor Oliveira</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#222529" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Página estática, sem JavaScript: a Vercel a serve em qualquer endereço inexistente.
         O <style> inline é liberado pela CSP (style-src 'unsafe-inline'). -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #222529;
        color: #edebe5;
        font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      .code {
        margin: 0;
        color: #ff5b1a;
        font-size: clamp(5rem, 30vw, 9rem);
        font-weight: 900;
        font-stretch: 62%;
        line-height: 0.85;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 1.25rem 0 0.75rem;
        font-size: clamp(1.5rem, 6vw, 2.25rem);
        font-weight: 800;
        font-stretch: 75%;
        text-transform: uppercase;
        line-height: 1.05;
      }
      p {
        margin: 0;
        color: #9a9fa5;
        font-size: 1.0625rem;
        line-height: 1.55;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 2rem;
        padding: 0 1.5rem;
        border-radius: 0.375rem;
        background: #ff5b1a;
        color: #1b1d20;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #edebe5;
      }
      a:focus-visible {
        outline: 2px solid #edebe5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Essa série não está na ficha</h1>
      <p>A página que você procurou não existe ou mudou de endereço.</p>
      <a href="/">Voltar para o início</a>
    </main>
  </body>
</html>
